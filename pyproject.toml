[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-rag"
version = "0.1.0"
description = "Pressure-adaptive evidence frontloading for RAG systems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
pace-audit-2wiki-corpus = "pace.cohort.run_corpus_coverage:main"
pace-retrieve = "pace.cohort.run_retrieval:main"
pace-materialize-cohort = "pace.cohort.materialize_cohort:main"
pace-prepare-cache = "pace.preprocessing.prepare_cache:main"
pace-evaluate = "pace.evaluation.run_effectiveness:main"
pace-serve = "pace.serving.benchmark:main"
pace-plot-serving = "pace.serving.plot_results:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
models = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.28",
]
cohort = [
    "datasets>=2.18",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]